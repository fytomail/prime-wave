openapi: 3.1.0
info:
  # Do not change the title, if the title changes, the import paths will be broken
  title: Api
  version: 0.1.0
  description: Prime Wave API specification
servers:
  - url: /api
    description: Base API path
tags:
  - name: health
    description: Health operations
  - name: auth
    description: Authentication operations
  - name: roadmap
    description: Roadmap, semester, module, and topic navigation
  - name: ai
    description: AI Learning assistant features
  - name: students
    description: Student management
  - name: semesters
    description: Semester and module management
  - name: topics
    description: Topic and learning content
  - name: assignments
    description: Assignments and submissions
  - name: projects
    description: Module mini-projects and capstone
  - name: certificates
    description: Certificates and credits
  - name: portfolio
    description: Portfolio management
  - name: leaderboard
    description: Global and university leaderboards
  - name: jobs
    description: Job postings and HR portal
  - name: companies
    description: Company management
  - name: company
    description: Company portal operations
  - name: feedback
    description: User feedback operations
  - name: dashboard
    description: Dashboard summary endpoints
  - name: admin
    description: Platform Admin operations

paths:

  # ─── AUTH ───────────────────────────────────────────────────────────────
  /auth/register:
    post:
      operationId: register
      tags: [auth]
      summary: Register new user
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                name: { type: string, example: "John Doe" }
                username: { type: string, example: "johndoe" }
                email: { type: string, example: "student@example.com" }
                password: { type: string, example: "password123" }
                role: { type: string, example: "student" }
                phone: { type: string, example: "+1 555 0199" }
                defaultPortal: { type: string, example: "Student Portal" }
      responses:
        "201":
          description: User registered successfully with access token and refresh token
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuthResponse"
        "400":
          description: Validation error or email already exists
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /auth/login:
    post:
      operationId: login
      tags: [auth]
      summary: Login with username/email and password
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                username: { type: string, example: "student" }
                email: { type: string, example: "student@example.com" }
                password: { type: string, example: "student123" }
      responses:
        "200":
          description: Login successful - returns user profile, student data, access token, and refresh token
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuthResponse"
        "401":
          description: Invalid credentials
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /auth/logout:
    post:
      operationId: logout
      tags: [auth]
      summary: Logout
      responses:
        "200":
          description: Successful response
          content:
            application/json:
              schema:
                type: object
                properties:
                  success: { type: boolean }
                  message: { type: string }

  /auth/refresh-token:
    post:
      operationId: refreshToken
      tags: [auth]
      summary: Refresh JWT Access and Refresh tokens
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                refreshToken: { type: string }
      responses:
        "200":
          description: Tokens refreshed successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  success: { type: boolean }
                  message: { type: string }
                  data:
                    type: object
                    properties:
                      tokens: { $ref: "#/components/schemas/Tokens" }
        "401":
          description: Invalid or expired refresh token
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /auth/forgot-password:
    post:
      operationId: forgotPassword
      tags: [auth]
      summary: Forgot password
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                email: { type: string }
      responses:
        "200":
          description: Password reset link sent if account exists
          content:
            application/json:
              schema:
                type: object
                properties:
                  success: { type: boolean }
                  message: { type: string }

  /auth/reset-password:
    post:
      operationId: resetPassword
      tags: [auth]
      summary: Reset password
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                token: { type: string }
                newPassword: { type: string }
      responses:
        "200":
          description: Password reset successful
          content:
            application/json:
              schema:
                type: object
                properties:
                  success: { type: boolean }
                  message: { type: string }

  /auth/profile:
    get:
      operationId: getProfile
      tags: [auth]
      summary: Get logged-in user profile with active tokens
      responses:
        "200":
          description: Logged-in user profile and updated tokens
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuthResponse"
        "401":
          description: Unauthorized - invalid or missing access token
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /auth/change-password:
    put:
      operationId: changePassword
      tags: [auth]
      summary: Change password
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                currentPassword: { type: string }
                newPassword: { type: string }
      responses:
        "200":
          description: Successful response
          content:
            application/json:
              schema:
                type: object
                properties:
                  success: { type: boolean }
                  message: { type: string }
        "401":
          description: Invalid access token
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /auth/verify-token:
    get:
      operationId: verifyToken
      tags: [auth]
      summary: Verify JWT access token
      responses:
        "200":
          description: JWT is valid
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuthResponse"
        "401":
          description: Invalid or expired access token
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"


  /healthz:
    get:
