components:
  schemas:

    DashboardOverviewResponse:
      type: object
      properties:
        success: { type: boolean }
        message: { type: string }
        data:
          type: object
          properties:
            user: { $ref: "#/components/schemas/User" }
            student: { $ref: "#/components/schemas/Student" }
            stats:
              type: object
              properties:
                creditScore: { type: number }
                currentSemester: { type: number }
                leaderboardRank: { type: number }
                completedProjectsCount: { type: number }
                completedAssignmentsCount: { type: number }
            recentProjects:
              type: array
              items: { type: object }
            recentAssignments:
              type: array
              items: { type: object }

    User:
      type: object
      properties:
        _id: { type: string }
        name: { type: string }
        username: { type: string }
        email: { type: string }
        role: { type: string }
        defaultPortal: { type: string }
        isEmailVerified: { type: boolean }

    Tokens:
      type: object
      properties:
        accessToken: { type: string }
        refreshToken: { type: string }

    AuthResponse:
      type: object
      properties:
        success: { type: boolean }
        message: { type: string }
        data:
          type: object
          properties:
            user: { $ref: "#/components/schemas/User" }
            student: { $ref: "#/components/schemas/Student" }
            tokens: { $ref: "#/components/schemas/Tokens" }

    ErrorResponse:
      type: object
      properties:
        status: { type: string }
        error:
          type: object
          properties:
            statusCode: { type: number }
            message: { type: string }
    HealthStatus:
      type: object
      required: [status]
      properties:
        status:
          type: string

    # ─── STUDENT ──────────────────────────────────────────────────────────────
    Student:
      type: object
      required: [id, name, email, role, status, semesterNumber, ppsScore, creditsEarned]
      properties:
        id: { type: string }
        name:           { type: string }
        email:          { type: string }
        phone:          { type: ["string", "null"] }
        avatar:         { type: ["string", "null"] }
        university:     { type: ["string", "null"] }
        degree:         { type: ["string", "null"] }
        skills:
          type: array
          items: { type: string }
        preferredRole:  { type: ["string", "null"] }
        preferredLang:  { type: ["string", "null"] }
        role:           { type: string }
        status:         { type: string }
        semesterNumber: { type: integer }
        ppsScore:       { type: number }
        creditsEarned:  { type: integer }
        industryReadiness: { type: number }
        createdAt:      { type: string }

    StudentInput:
      type: object
      required: [name, email]
      properties:
        name:          { type: string }
        email:         { type: string }
        phone:         { type: string }
        university:    { type: string }
        degree:        { type: string }
        skills:
          type: array
          items: { type: string }
        preferredRole: { type: string }
        preferredLang: { type: string }

    StudentUpdate:
      type: object
      properties:
        name:          { type: string }
        phone:         { type: string }
        university:    { type: string }
        degree:        { type: string }
        skills:
          type: array
          items: { type: string }
        preferredRole: { type: string }
        preferredLang: { type: string }

    StudentStats:
      type: object
      required: [studentId, totalTopicsCompleted, totalAssignmentsPassed, avgScore, streakDays]
      properties:
        studentId: { type: string }
        totalTopicsCompleted:    { type: integer }
        totalModulesCompleted:   { type: integer }
        totalAssignmentsPassed:  { type: integer }
        avgScore:                { type: number }
        streakDays:              { type: integer }
        quizPassRate:            { type: number }
        codeQualityAvg:          { type: number }
        communicationScore:      { type: number }

    # ─── SEMESTER & MODULE ────────────────────────────────────────────────────
    Semester:
      type: object
      required: [id, number, title, description, creditsRequired, status]
      properties:
        id: { type: string }
        number:          { type: integer }
        title:           { type: string }
        description:     { type: string }
        creditsRequired: { type: integer }
        status:          { type: string }
        modules:
          type: array
          items:
            $ref: "#/components/schemas/Module"

    Module:
      type: object
      required: [id, semesterId, title, description, order, status]
      properties:
        id: { type: string }
        semesterId: { type: string }
        title:       { type: string }
        description: { type: string }
        order:       { type: integer }
        status:      { type: string }
        topicsCount: { type: integer }
        score:       { type: ["number", "null"] }

    SemesterProgress:
      type: object
      required: [semesterId, studentId, completedModules, totalModules, completedTopics, totalTopics, overallScore, status]
      properties:
        semesterId: { type: string }
        studentId: { type: string }
        completedModules:  { type: integer }
        totalModules:      { type: integer }
        completedTopics:   { type: integer }
        totalTopics:       { type: integer }
        overallScore:      { type: number }
        status:            { type: string }
        creditsEarned:     { type: ["integer", "null"] }

    # ─── TOPIC ────────────────────────────────────────────────────────────────
    Topic:
      type: object
      required: [id, moduleId, title, order, status]
      properties:
        id: { type: string }
        moduleId: { type: string }
        title:       { type: string }
        description: { type: ["string", "null"] }
        order:       { type: integer }
        status:      { type: string }
        contentType: { type: string }
        duration:    { type: ["integer", "null"] }
        isCompleted: { type: boolean }

    TopicCompleteInput:
      type: object
      required: [studentId]
      properties:
        studentId: { type: string }
        quizScore: { type: number }
        timeSpent: { type: integer }

    TopicCompletion:
      type: object
      required: [id, topicId, studentId, completedAt, quizScore]
      properties:
        id: { type: string }
        topicId: { type: string }
        studentId: { type: string }
        completedAt: { type: string }
        quizScore:   { type: number }

    # ─── ASSIGNMENT ───────────────────────────────────────────────────────────
    Assignment:
      type: object
      required: [id, topicId, title, description, type, status, maxScore]
      properties:
        id: { type: string }
        topicId: { type: string }
        title:       { type: string }
        description: { type: string }
        type:        { type: string }
        status:      { type: string }
        maxScore:    { type: number }
        deadline:    { type: ["string", "null"] }
        attempts:    { type: integer }
        maxAttempts: { type: integer }

    SubmissionInput:
      type: object
      required: [studentId, content]
      properties:
        studentId: { type: string }
        content:   { type: string }
        githubUrl: { type: string }
        notes:     { type: string }

    Submission:
      type: object
      required: [id, assignmentId, studentId, status, submittedAt]
      properties:
        id: { type: string }
        assignmentId: { type: string }
        studentId: { type: string }
        content:      { type: string }
        githubUrl:    { type: ["string", "null"] }
        status:       { type: string }
        score:        { type: ["number", "null"] }
        submittedAt:  { type: string }

    Evaluation:
      type: object
      required: [id, submissionId, overallScore, passed]
      properties:
        id: { type: string }
        submissionId: { type: string }
        overallScore:   { type: number }
        passed:         { type: boolean }
        accuracy:       { type: number }
        logic:          { type: number }
        codeQuality:    { type: number }
        documentation:  { type: number }
        security:       { type: number }
        performance:    { type: number }
        bestPractices:  { type: number }
        feedback:       { type: string }
        weakAreas:
          type: array
          items: { type: string }
        improvementPlan: { type: ["string", "null"] }
        evaluatedAt:    { type: string }

    # ─── PROJECT ──────────────────────────────────────────────────────────────
    Project:
      type: object
      required: [id, studentId, title, type, status, createdAt]
      properties:
        id: { type: string }
        studentId: { type: string }
        moduleId:    { type: ["integer", "null"] }
        semesterId:  { type: ["integer", "null"] }
        title:       { type: string }
        description: { type: ["string", "null"] }
        type:        { type: string }
        status:      { type: string }
        githubUrl:   { type: ["string", "null"] }
        score:       { type: ["number", "null"] }
        techStack:
          type: array
          items: { type: string }
        createdAt:   { type: string }
        submittedAt: { type: ["string", "null"] }

    ProjectInput:
      type: object
      required: [studentId, title, type]
      properties:
        studentId: { type: string }
        moduleId: { type: string }
        semesterId: { type: string }
        title:       { type: string }
        description: { type: string }
        type:        { type: string }
        techStack:
          type: array
          items: { type: string }

    ProjectUpdate:
      type: object
      properties:
        title:       { type: string }
        description: { type: string }
        githubUrl:   { type: string }
        status:      { type: string }
        techStack:
          type: array
          items: { type: string }

    # ─── CERTIFICATE ──────────────────────────────────────────────────────────
    Certificate:
      type: object
      required: [id, studentId, type, title, issuedAt, creditsAwarded, verificationCode]
      properties:
        id: { type: string }
        studentId: { type: string }
        type:             { type: string }
        title:            { type: string }
        semesterNumber:   { type: ["integer", "null"] }
        issuedAt:         { type: string }
        creditsAwarded:   { type: integer }
        score:            { type: ["number", "null"] }
        verificationCode: { type: string }
        qrCodeUrl:        { type: ["string", "null"] }

    # ─── PORTFOLIO ────────────────────────────────────────────────────────────
    Portfolio:
      type: object
      required: [studentId, ppsScore, creditsEarned, industryReadiness, semestersCompleted]
      properties:
        studentId: { type: string }
        studentName:         { type: string }
        university:          { type: string }
        ppsScore:            { type: number }
        creditsEarned:       { type: integer }
        industryReadiness:   { type: number }
        semestersCompleted:  { type: integer }
        certificates:
          type: array
          items:
            $ref: "#/components/schemas/Certificate"
        projects:
          type: array
          items:
            $ref: "#/components/schemas/Project"
        skills:
          type: array
          items: { type: string }
        githubUrl:           { type: ["string", "null"] }
        linkedinUrl:         { type: ["string", "null"] }

    # ─── LEADERBOARD ─────────────────────────────────────────────────────────
    LeaderboardEntry:
      type: object
      required: [rank, studentId, studentName, ppsScore, creditsEarned, semesterNumber, university]
      properties:
        rank:            { type: integer }
        studentId: { type: string }
        studentName:     { type: string }
        avatar:          { type: ["string", "null"] }
        university:      { type: string }
        ppsScore:        { type: number }
        creditsEarned:   { type: integer }
        semesterNumber:  { type: integer }
        industryReadiness: { type: number }
        badges:
          type: array
          items: { type: string }

    # ─── JOB & COMPANY ───────────────────────────────────────────────────────
    Job:
      type: object
      required: [id, companyId, companyName, title, description, status, createdAt]
      properties:
        id: { type: string }
        companyId: { type: string }
        companyName:  { type: string }
        title:        { type: string }
        description:  { type: string }
        requiredSkills:
          type: array
          items: { type: string }
        minPpsScore:  { type: ["number", "null"] }
        minCredits:   { type: ["integer", "null"] }
        location:     { type: ["string", "null"] }
        type:         { type: string }
        status:       { type: string }
        applicantsCount: { type: integer }
        createdAt:    { type: string }

    JobInput:
      type: object
      required: [companyId, title, description]
      properties:
        companyId: { type: string }
        title:        { type: string }
        description:  { type: string }
        requiredSkills:
          type: array
          items: { type: string }
        minPpsScore:  { type: number }
        minCredits:   { type: integer }
        location:     { type: string }
        type:         { type: string }

    CandidateMatch:
      type: object
      required: [studentId, studentName, matchScore, ppsScore, creditsEarned, semesterNumber]
      properties:
        studentId: { type: string }
        studentName:      { type: string }
        avatar:           { type: ["string", "null"] }
        university:       { type: string }
        matchScore:       { type: number }
        ppsScore:         { type: number }
        creditsEarned:    { type: integer }
        semesterNumber:   { type: integer }
        industryReadiness: { type: number }
        skills:
          type: array
          items: { type: string }
        githubUrl:        { type: ["string", "null"] }
        portfolioUrl:     { type: ["string", "null"] }
        skillsMatchPct:   { type: number }

    Company:
      type: object
      required: [id, name, email, industry, status, createdAt]
      properties:
        id: { type: string }
        name:        { type: string }
        email:       { type: string }
        industry:    { type: string }
        website:     { type: ["string", "null"] }
        logo:        { type: ["string", "null"] }
        status:      { type: string }
        jobsPosted:  { type: integer }
        hiredCount:  { type: integer }
        createdAt:   { type: string }

    CompanyInput:
      type: object
      required: [name, email, industry]
      properties:
        name:     { type: string }
        email:    { type: string }
        industry: { type: string }
        website:  { type: string }

    # ─── DASHBOARDS ──────────────────────────────────────────────────────────
    StudentDashboard:
      type: object
      required: [studentId, semesterNumber, creditsEarned, ppsScore, topicsCompleted, assignmentsPassed, streakDays, industryReadiness, recentActivity]
      properties:
        studentId: { type: string }
        semesterNumber:      { type: integer }
        creditsEarned:       { type: integer }
        ppsScore:            { type: number }
        topicsCompleted:     { type: integer }
        modulesCompleted:    { type: integer }
        assignmentsPassed:   { type: integer }
        streakDays:          { type: integer }
        industryReadiness:   { type: number }
        nextTopic:           { type: ["string", "null"] }
        nextDeadline:        { type: ["string", "null"] }
        recentActivity:
          type: array
          items:
            $ref: "#/components/schemas/ActivityItem"
        semesterProgress:
          $ref: "#/components/schemas/SemesterProgress"

    ActivityItem:
      type: object
      required: [id, type, title, timestamp]
      properties:
        id: { type: string }
        type:      { type: string }
        title:     { type: string }
        detail:    { type: ["string", "null"] }
        score:     { type: ["number", "null"] }
        timestamp: { type: string }

    PlatformDashboard:
      type: object
      required: [totalStudents, totalCompanies, totalJobsPosted, avgPpsScore, totalCertificatesIssued, placementRate, totalCreditsAwarded]
      properties:
        totalStudents:          { type: integer }
        totalCompanies:         { type: integer }
        totalJobsPosted:        { type: integer }
        avgPpsScore:            { type: number }
        totalCertificatesIssued: { type: integer }
        placementRate:          { type: number }
        totalCreditsAwarded:    { type: integer }
        studentsPerSemester:
          type: array
          items:
            $ref: "#/components/schemas/SemesterCount"
        topUniversities:
          type: array
          items:
            $ref: "#/components/schemas/UniversityCount"

    SemesterCount:
      type: object
      required: [semester, count]
      properties:
        semester: { type: integer }
        count:    { type: integer }

    UniversityCount:
      type: object
      required: [university, count]
      properties:
        university: { type: string }
        count:      { type: integer }

    HrDashboard:
      type: object
      required: [companyId, activeJobs, totalApplicants, totalHired, avgMatchScore, recentCandidates]
      properties:
        companyId: { type: string }
        activeJobs:       { type: integer }
        totalApplicants:  { type: integer }
        totalHired:       { type: integer }
        avgMatchScore:    { type: number }
        recentCandidates:
          type: array
          items:
            $ref: "#/components/schemas/CandidateMatch"
