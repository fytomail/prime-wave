kind = "web"
previewPath = "/"
title = "Prime Wave"
version = "1.0.0"
id = "artifacts/prime-wave"
router = "path"

[[services]]
name = "web"
paths = [ "/" ]
localPort = 23022

[services.development]
run = "pnpm --filter @workspace/prime-wave run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/prime-wave", "run", "build" ]
serve = "static"
publicDir = "artifacts/prime-wave/dist/public"

[[services.production.rewrites]]
from = "/*"
to = "/index.html"

[services.env]
PORT = "23022"
BASE_PATH = "/"
